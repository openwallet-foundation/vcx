# For details on how this file works refer to:
#   - https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  #  - Check for updates once a week
  #  - Group all updates into a single PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns: ["*"]

  # Maintain dependencies for Cargo Packages
  #  - All crates in this repository belong to the root Cargo workspace and share
  #    the root Cargo.lock, so only the workspace root needs to be watched.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for docker
  - package-ecosystem: "docker"
    directories:
      - "/.github/ci"
      - "/aries/agents/aath-backchannel"
      - "/aries/agents/mediator"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
