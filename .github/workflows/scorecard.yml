name: OpenSSF Scorecard

on:
  # Re-run when branch protection settings change, since Scorecard grades them.
  branch_protection_rule:
  schedule:
    - cron: "27 6 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: "Scorecard analysis"
    runs-on: ubuntu-22.04
    permissions:
      # Upload the SARIF results to the code scanning dashboard.
      security-events: write
      # Publish results to the OpenSSF API so the badge and public scores work.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Git checkout"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is required for the public Scorecard badge/API entry. It
          # only uploads the score, not repository contents.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code scanning dashboard"
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
